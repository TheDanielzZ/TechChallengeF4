# Datasource do Loki no Grafana, descoberto pelo sidecar do kube-prometheus-stack
# (label grafana_datasource=1). uid fixo "loki": o dashboard usa a variável ${loki}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
