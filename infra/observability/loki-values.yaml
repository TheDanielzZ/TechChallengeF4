# Helm values do Grafana Loki (chart grafana/loki 6.x) — modo SingleBinary, armazenamento em disco (PVC).
# Adequado para laboratório/entrega: 1 réplica, sem MinIO, sem cache, sem gateway.
# Para produção: object storage (Azure Blob) e modo SimpleScalable.
#
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki -n logging --create-namespace -f loki-values.yaml
#
# Endpoints (Service "loki", ns logging):
#   push OTLP : http://loki.logging.svc.cluster.local:3100/otlp   <- o OTel Collector envia aqui
#   consulta  : http://loki.logging.svc.cluster.local:3100        <- datasource do Grafana
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # tenant único; sem header X-Scope-OrgID
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13              # v13 + tsdb = exigido para OTLP/structured metadata
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true   # OBRIGATÓRIO para ingestão OTLP
    retention_period: 72h             # logs de 3 dias (ajuste conforme o disco)
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

# --- desliga os componentes do modo distribuído / extras ---
backend:  { replicas: 0 }
read:     { replicas: 0 }
write:    { replicas: 0 }
ingester: { replicas: 0 }
querier:  { replicas: 0 }
queryFrequencyProxy: { replicas: 0 }
queryScheduler:      { replicas: 0 }
distributor:         { replicas: 0 }
compactor:           { replicas: 0 }
indexGateway:        { replicas: 0 }
bloomCompactor:      { replicas: 0 }
bloomGateway:        { replicas: 0 }

gateway:      { enabled: false }
minio:        { enabled: false }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
