# Component Kustomize: injeta as variáveis do OpenTelemetry em TODOS os Deployments
# do overlay que o referenciar. Uso (nos overlays/<env>/<servico>/kustomization.yaml):
#
#   components:
#   - ../../../components/otel-env
#
# As aplicações exportam métricas e traces via OTLP/HTTP para o OTel Collector. As
# métricas ele expõe no formato Prometheus (porta 8889, scrape via ServiceMonitor);
# os traces seguem para o APM.
# Sem OTEL_EXPORTER_OTLP_ENDPOINT o código das aplicações vira no-op.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
    patch: |-
      # POD_NAME / POD_NAMESPACE precisam vir ANTES de OTEL_RESOURCE_ATTRIBUTES
      # (o Kubernetes só expande $(VAR) para variáveis definidas acima).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      # service.name = label "app" do pod (auth-service, flag-service, ...)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),deployment.environment=prod
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4318
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_METRIC_EXPORT_INTERVAL
          value: "15000"
      # Logs não vão por OTLP: o agente do Collector (DaemonSet, filelog) já lê o
      # stdout de todos os contêineres e manda ao Loki. Ligar aqui duplicaria as linhas.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_LOGS_EXPORTER
          value: none
