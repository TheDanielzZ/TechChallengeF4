apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: toggle-apps
  labels:
    app: targeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: acrtogglemasterprodhmzq.azurecr.io/targeting-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
          # Memória medida com 4 workers do gunicorn e o SDK do OpenTelemetry carregado
          # (cada worker tem o seu): ~180Mi. Com o limite antigo (128Mi) o pod era
          # OOMKilled logo no boot.
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "250m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 20
